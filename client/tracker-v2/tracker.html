<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nexora Tracker</title>

    <link
        rel="stylesheet"
        href="tracker.css">

</head>

<body>

<div class="tracker-page">

    <!-- HEADER -->

    <div class="tracker-header">

        <h1>Your Watchlist</h1>

        <p>
            Track your anime journey with Nexora.
        </p>

    </div>


    <!-- SEARCH -->

    <div class="tracker-search">

        <div class="search-wrapper">

            <span class="search-icon">

                🔍

            </span>

            <input
                id="searchInput"
                placeholder="Search Anime..."
                autocomplete="off">

        </div>

    </div>


    <!-- SEARCH RESULTS -->

    <div
        id="searchResults"
        class="search-results">

    </div>


    <!-- TRENDING -->

    <section class="tracker-section">

        <div class="section-title-row">

            <h2>🔥 Trending Now</h2>

            <button>

                View all

            </button>

        </div>

        <div
            id="trendingList"
            class="poster-row">

        </div>

    </section>


    <!-- CONTINUE -->

    <section class="tracker-section">

        <div class="section-title-row">

            <h2>

                Continue Watching

            </h2>

        </div>

        <div
            id="continueWatching"
            class="continue-row">

        </div>

    </section>


    <!-- LIBRARY -->

    <section class="tracker-section">

        <div class="section-title-row">

            <h2>

                My Library

            </h2>

        </div>

        <div class="tracker-filter">

            <button class="active">

                All

            </button>

            <button>

                Watching

            </button>

            <button>

                Completed

            </button>

            <button>

                Plan

            </button>

            <button>

                Hold

            </button>

        </div>

        <div
            id="libraryGrid"
            class="library-grid">

        </div>

    </section>


    <button class="floating-btn">

        +

    </button>

</div>

</body>

</html>
